<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#131b2c"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Fundo Squircle Suave -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#263450" stroke-width="4" filter="url(#iconShadow)"/>

  <!-- Brilho Ambiente Central -->
  <circle cx="256" cy="240" r="160" fill="#1e293b" opacity="0.4"/>

  <!-- Ondas de Sinal Wi-Fi / Rede / Internet (Topo) -->
  <!-- Onda Superior Externa (Sky Blue) -->
  <path d="M140 160 A 150 150 0 0 1 372 160" stroke="url(#skyGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
  
  <!-- Onda Média (Emerald Green) -->
  <path d="M178 195 A 105 105 0 0 1 334 195" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- Onda Interna / Ponto Emissor -->
  <circle cx="256" cy="225" r="14" fill="#38bdf8"/>

  <!-- SERVIDOR: Rack Superior (Unidade 1) -->
  <rect x="130" y="255" width="252" height="70" rx="14" fill="#1a253c" stroke="#263450" stroke-width="3"/>
  <!-- Slots / Baias de Disco -->
  <rect x="156" y="280" width="104" height="20" rx="6" fill="#334155"/>
  <rect x="162" y="286" width="42" height="8" rx="3" fill="#38bdf8"/>
  <rect x="210" y="286" width="42" height="8" rx="3" fill="#64748b"/>
  <!-- LED Status Emerald -->
  <circle cx="346" cy="290" r="10" fill="#10b981"/>
  <circle cx="346" cy="290" r="5" fill="#a7f3d0"/>

  <!-- SERVIDOR: Rack Inferior (Unidade 2) -->
  <rect x="130" y="345" width="252" height="70" rx="14" fill="#1a253c" stroke="#263450" stroke-width="3"/>
  <!-- Slots / Baias de Disco -->
  <rect x="156" y="370" width="104" height="20" rx="6" fill="#334155"/>
  <rect x="162" y="376" width="42" height="8" rx="3" fill="#10b981"/>
  <rect x="210" y="376" width="42" height="8" rx="3" fill="#64748b"/>
  <!-- LED Status Sky Blue -->
  <circle cx="346" cy="380" r="10" fill="#38bdf8"/>
  <circle cx="346" cy="380" r="5" fill="#bae6fd"/>

  <!-- Escudo / Cadeado de Segurança HTTPS TLS 1.3 -->
  <g transform="translate(256, 420)">
    <path d="M0 -15 L32 -3 V16 C32 36 18 52 0 60 C-18 52 -32 36 -32 16 V-3 Z" fill="url(#emeraldGrad)" stroke="#0b0f17" stroke-width="4"/>
    <!-- Cadeado Dentro do Escudo -->
    <rect x="-10" y="10" width="20" height="18" rx="4" fill="#0b0f17"/>
    <path d="M-6 10 V4 A6 6 0 0 1 6 4 V10" stroke="#0b0f17" stroke-width="3.5" fill="none"/>
    <circle cx="0" cy="18" r="2.5" fill="#10b981"/>
  </g>
</svg>
