<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra suave e difusa padrão iOS/macOS/Linear -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="iconDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Fundo Dark Slate Profundo com sutil iluminação superior -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141C2E" />
      <stop offset="100%" stop-color="#090D15" />
    </linearGradient>

    <!-- Borda sutil de vidro / acrílico -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#263450" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Gradiente do Símbolo Server Cloud: Cyan para Esmeralda -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Gradiente da Barra Flutuante Superior -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Fundo Squircle Suave -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#iconDepth)" />

  <!-- Luz Ambiente Suave no Centro (Glow Esmeralda/Cyan) -->
  <circle cx="256" cy="240" r="130" fill="#10B981" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="256" cy="280" r="100" fill="#38BDF8" opacity="0.08" filter="url(#softGlow)" />

  <!-- SÍMBOLO PRINCIPAL: Monograma Geométrico Ultra-Clean -->
  <!-- Barra de Servidor / Nuvem Superior (Linha Conectada de Transmissão) -->
  <path d="M168 160 C 200 132, 312 132, 344 160" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" />
  
  <!-- Torre / Rack Geométrico Moderno Isométrico Minimalista -->
  <!-- Nível 1: Plataforma Superior -->
  <rect x="144" y="196" width="224" height="60" rx="18" fill="#182338" stroke="#2B3B59" stroke-width="2.5" />
  <!-- Ponto Indicador Status Ativo -->
  <circle cx="180" cy="226" r="8" fill="#38BDF8" />
  <circle cx="204" cy="226" r="4" fill="#334155" />
  <!-- Barra de atividade sutil -->
  <rect x="236" y="222" width="96" height="8" rx="4" fill="#24324B" />
  <rect x="236" y="222" width="48" height="8" rx="4" fill="#38BDF8" opacity="0.8" />

  <!-- Nível 2: Bloco Central de Hospedagem / Dados -->
  <rect x="144" y="272" width="224" height="60" rx="18" fill="#182338" stroke="#2B3B59" stroke-width="2.5" />
  <!-- Ponto Indicador Status Esmeralda -->
  <circle cx="180" cy="302" r="8" fill="#10B981" />
  <circle cx="204" cy="302" r="4" fill="#334155" />
  <!-- Barra de atividade sutil -->
  <rect x="236" y="298" width="96" height="8" rx="4" fill="#24324B" />
  <rect x="236" y="298" width="68" height="8" rx="4" fill="#10B981" opacity="0.9" />

  <!-- Conectividade Base: Feixe Central de Comunicação (Raio Geométrico / Link de Rede) -->
  <path d="M256 348 L256 388" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />
  
  <!-- Base de Ancoragem / Antena de Rede -->
  <circle cx="256" cy="406" r="14" fill="#10B981" />
  <circle cx="256" cy="406" r="6" fill="#A7F3D0" />
</svg>
