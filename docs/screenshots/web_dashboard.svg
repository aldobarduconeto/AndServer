<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadowWeb" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Janela do Navegador -->
  <rect x="20" y="20" width="960" height="600" rx="16" fill="#0b0f17" stroke="#263450" stroke-width="2" filter="url(#shadowWeb)"/>

  <!-- Top Bar / Chrome -->
  <path d="M 20 36 A 16 16 0 0 1 36 20 L 964 20 A 16 16 0 0 1 980 36 L 980 64 L 20 64 Z" fill="#131b2c"/>
  <circle cx="45" cy="42" r="5" fill="#ef4444"/>
  <circle cx="62" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="42" r="5" fill="#10b981"/>

  <!-- Barra de Endereço URL -->
  <rect x="180" y="30" width="620" height="26" rx="6" fill="#1a253c" stroke="#263450" stroke-width="1"/>
  <text x="196" y="47" fill="#10b981" font-size="11">🔒</text>
  <text x="214" y="47" fill="#f8fafc" font-size="11.5" font-family="monospace">https://192.168.1.105:8443</text>
  <text x="784" y="47" fill="#94a3b8" font-size="11" text-anchor="end">⚡ WSS Ativo</text>

  <!-- Conteúdo Web -->
  <!-- Header -->
  <g transform="translate(50, 84)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#1a253c" stroke="#263450" stroke-width="1"/>
    <circle cx="10" cy="10" r="3.5" fill="#10b981"/>
    <text x="20" y="14" fill="#10b981" font-size="9" font-weight="800" letter-spacing="1">AND SERVER</text>

    <text x="0" y="42" fill="#f8fafc" font-size="22" font-weight="800">Central do Servidor</text>
    <text x="0" y="58" fill="#94a3b8" font-size="12">Serviço HTTPS seguro com controle de acesso LAN / Internet</text>

    <!-- Badges Header -->
    <rect x="580" y="14" width="144" height="28" rx="8" fill="#1a253c" stroke="#263450" stroke-width="1"/>
    <text x="652" y="32" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">📱 QR Code de Acesso</text>

    <rect x="732" y="14" width="104" height="28" rx="14" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <text x="784" y="32" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle">🌍 INTERNET</text>

    <rect x="844" y="14" width="86" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="858" cy="28" r="4" fill="#10b981"/>
    <text x="892" y="32" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle">ONLINE</text>
  </g>

  <!-- Stats Grid -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="900" height="90" rx="12" fill="#131b2c" stroke="#263450" stroke-width="1"/>
    
    <!-- Stat 1 -->
    <rect x="12" y="12" width="138" height="66" rx="8" fill="#1a253c"/>
    <text x="22" y="32" fill="#64748b" font-size="8.5" font-weight="800">ESCOPO DE REDE</text>
    <text x="22" y="56" fill="#38bdf8" font-size="14" font-weight="800">🌍 Internet (WAN)</text>

    <!-- Stat 2 -->
    <rect x="160" y="12" width="138" height="66" rx="8" fill="#1a253c"/>
    <text x="170" y="32" fill="#64748b" font-size="8.5" font-weight="800">IP LOCAL (LAN)</text>
    <text x="170" y="56" fill="#f8fafc" font-size="13" font-family="monospace">192.168.1.105</text>

    <!-- Stat 3 -->
    <rect x="308" y="12" width="138" height="66" rx="8" fill="#1a253c"/>
    <text x="318" y="32" fill="#64748b" font-size="8.5" font-weight="800">IP PÚBLICO (WAN)</text>
    <text x="318" y="56" fill="#38bdf8" font-size="13" font-family="monospace">187.102.44.89</text>

    <!-- Stat 4 -->
    <rect x="456" y="12" width="138" height="66" rx="8" fill="#1a253c"/>
    <text x="466" y="32" fill="#64748b" font-size="8.5" font-weight="800">ESCUDO FORÇA BRUTA</text>
    <text x="466" y="56" fill="#10b981" font-size="13" font-weight="700">🛡️ Auto-Ban Ativo</text>

    <!-- Stat 5 -->
    <rect x="604" y="12" width="138" height="66" rx="8" fill="#1a253c"/>
    <text x="614" y="32" fill="#64748b" font-size="8.5" font-weight="800">CONEXÕES ATIVAS</text>
    <text x="614" y="56" fill="#f8fafc" font-size="16" font-weight="800">4 simultâneas</text>

    <!-- Stat 6 -->
    <rect x="752" y="12" width="136" height="66" rx="8" fill="#1a253c"/>
    <text x="762" y="32" fill="#64748b" font-size="8.5" font-weight="800">TRÁFEGO TOTAL</text>
    <text x="762" y="56" fill="#f8fafc" font-size="14" font-weight="800">142.7 MB</text>
  </g>

  <!-- Abas de Navegação -->
  <g transform="translate(50, 264)">
    <rect x="0" y="0" width="460" height="34" rx="8" fill="#131b2c" stroke="#263450" stroke-width="1"/>
    <rect x="2" y="2" width="126" height="30" rx="6" fill="#10b981"/>
    <text x="65" y="21" fill="#0b0f17" font-size="11.5" font-weight="700" text-anchor="middle">📁 Arquivos &amp; Mídia</text>
    <text x="180" y="21" fill="#94a3b8" font-size="11.5" font-weight="600" text-anchor="middle">⚙️ Configurações</text>
    <text x="290" y="21" fill="#94a3b8" font-size="11.5" font-weight="600" text-anchor="middle">⚡ Eventos ao Vivo</text>
    <text x="395" y="21" fill="#94a3b8" font-size="11.5" font-weight="600" text-anchor="middle">📡 API, ZIP &amp; TLS</text>
  </g>

  <!-- Painel Gerenciador de Arquivos -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="900" height="290" rx="14" fill="#131b2c" stroke="#263450" stroke-width="1"/>

    <!-- Drag & Drop Zone -->
    <rect x="16" y="16" width="868" height="58" rx="8" fill="#1a253c" stroke="#263450" stroke-dasharray="6,4" stroke-width="1.5"/>
    <text x="450" y="42" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">☁️ Arraste e solte arquivos aqui para enviar (até 100 MB)</text>
    <text x="450" y="58" fill="#64748b" font-size="10.5" text-anchor="middle">ou clique para selecionar do dispositivo</text>

    <!-- Toolbar -->
    <rect x="16" y="86" width="300" height="32" rx="6" fill="#1a253c" stroke="#263450" stroke-width="1"/>
    <text x="28" y="106" fill="#64748b" font-size="11">🔍 Filtrar arquivos...</text>

    <rect x="326" y="86" width="110" height="32" rx="6" fill="#1a253c" stroke="#263450" stroke-width="1"/>
    <text x="381" y="106" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">➕ Nova Pasta</text>

    <rect x="446" y="86" width="154" height="32" rx="6" fill="#1a253c" stroke="#263450" stroke-width="1"/>
    <text x="523" y="106" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">📦 Baixar Tudo (.ZIP)</text>

    <!-- Lista de Arquivos -->
    <!-- Item 1: Pasta -->
    <rect x="16" y="130" width="868" height="36" rx="6" fill="#1a253c"/>
    <text x="28" y="152" fill="#f8fafc" font-size="12">📁 Documentos e Apresentações/</text>
    <text x="540" y="152" fill="#64748b" font-size="11">Pasta</text>
    <rect x="680" y="135" width="70" height="26" rx="4" fill="#131b2c" stroke="#263450" stroke-width="1"/>
    <text x="715" y="152" fill="#38bdf8" font-size="10.5" font-weight="600" text-anchor="middle">📦 ZIP</text>
    <rect x="760" y="135" width="60" height="26" rx="4" fill="#3d1a24"/>
    <text x="790" y="152" fill="#fca5a5" font-size="10.5" font-weight="600" text-anchor="middle">Excluir</text>

    <!-- Item 2: Imagem -->
    <rect x="16" y="172" width="868" height="36" rx="6" fill="#1a253c"/>
    <text x="28" y="194" fill="#10b981" font-size="12">🖼️ foto_painel_alta_resolucao.png</text>
    <text x="540" y="194" fill="#64748b" font-size="11">3.4 MB</text>
    <rect x="680" y="177" width="70" height="26" rx="4" fill="#131b2c" stroke="#263450" stroke-width="1"/>
    <text x="715" y="194" fill="#10b981" font-size="10.5" font-weight="600" text-anchor="middle">🔗 Link</text>
    <rect x="760" y="177" width="60" height="26" rx="4" fill="#3d1a24"/>
    <text x="790" y="194" fill="#fca5a5" font-size="10.5" font-weight="600" text-anchor="middle">Excluir</text>

    <!-- Item 3: Vídeo -->
    <rect x="16" y="214" width="868" height="36" rx="6" fill="#1a253c"/>
    <text x="28" y="236" fill="#10b981" font-size="12">🎬 demonstracao_app_tablet.mp4</text>
    <text x="540" y="236" fill="#64748b" font-size="11">24.8 MB</text>
    <rect x="680" y="219" width="70" height="26" rx="4" fill="#131b2c" stroke="#263450" stroke-width="1"/>
    <text x="715" y="236" fill="#10b981" font-size="10.5" font-weight="600" text-anchor="middle">🔗 Link</text>
    <rect x="760" y="219" width="60" height="26" rx="4" fill="#3d1a24"/>
    <text x="790" y="236" fill="#fca5a5" font-size="10.5" font-weight="600" text-anchor="middle">Excluir</text>
  </g>
</svg>
