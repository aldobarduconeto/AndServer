name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Preparar assinatura de Release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/andserver-release.jks"
            echo "KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_READY=false" >> $GITHUB_ENV
            echo "Secrets de assinatura de produção não encontrados. O APK de release usará assinatura de desenvolvimento."
          fi

      - name: Compilar APKs (Release & Debug)
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_READY == 'true' && format('{0}/andserver-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease assembleDebug --stacktrace -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}

      - name: Preparar binários para publicação
        run: |
          mkdir -p dist
          # Copia APKs compilados com nomes amigáveis
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/AndServer-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/AndServer-release.apk
          fi

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/AndServer-debug.apk
          fi

          ls -la dist/

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: AndServer Build #${{ github.run_number }}
          body: |
            ## 🚀 AndServer Android APK

            Compilação automática gerada a partir do commit `${{ github.sha }}`.

            - **Branch / Ref**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **Número da Build**: `${{ github.run_number }}`

            ### 📦 Binários Disponíveis:
            - **AndServer-release.apk**: APK otimizado, assinado e pronto para instalar diretamente no Android.
            - **AndServer-debug.apk**: APK de depuração com símbolos de debug.
          draft: false
          prerelease: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
